<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="nguyen khoi nguyen " />
    <title>Trang chủ sinh viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TrangChu.css" />
  </head>
  <body>
    <main class="page">
      <!-- ===== Banner chào mừng ===== -->
      <header class="hero">
        <div class="hero-text">
          <p class="hero-greet" id="greeting">Chào bạn,</p>
          <h1 id="studentName">SINH VIÊN</h1>
          <p class="hero-date">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect
                x="3"
                y="5"
                width="18"
                height="16"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M3 10h18M8 3v4M16 3v4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span id="today">--</span>
          </p>
        </div>
        <div class="hero-icon" aria-hidden="true">
          <svg
            viewBox="0 0 64 64"
            width="72"
            height="72"
            fill="none"
            stroke="#fff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M32 12 4 26l28 14 28-14z" />
            <path d="M16 33v12c0 4 7 8 16 8s16-4 16-8V33" />
            <path d="M60 26v16" />
          </svg>
        </div>
      </header>

      <!-- ===== 4 lối tắt ===== -->
      <nav class="quick">
        <a class="quick-item" href="#">
          <span class="q-icon blue">
            <svg
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="6" r="3" />
              <path d="M3 10l9 4 9-4v8l-9 4-9-4z" />
              <path d="M12 14v8" />
            </svg>
          </span>
          <span><small>HỌC TẬP</small><strong>Đăng ký học</strong></span>
        </a>
        <a class="quick-item" href="#">
          <span class="q-icon orange">
            <svg
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="16" rx="3" />
              <path d="M8 3v4M16 3v4M8 12h8M8 16h8" />
            </svg>
          </span>
          <span><small>LỊCH</small><strong>Thời khóa biểu</strong></span>
        </a>
        <a class="quick-item" href="#">
          <span class="q-icon green">
            <svg
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="6" width="18" height="14" rx="3" />
              <path d="M3 10V7a3 3 0 0 1 3-3h10" />
              <circle cx="16.5" cy="13" r="1" fill="#fff" />
            </svg>
          </span>
          <span><small>TÀI CHÍNH</small><strong>Học phí</strong></span>
        </a>
        <a class="quick-item" href="#">
          <span class="q-icon red">
            <svg
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M7 9h4v4H7zM14 9h4M14 13h4" />
            </svg>
          </span>
          <span
            ><small>THÔNG TIN</small
            ><strong>Tin tức &amp; thông báo</strong></span
          >
        </a>
      </nav>

      <!-- ===== Tin tức ===== -->
      <section class="columns">
        <div class="col">
          <article class="panel">
            <div class="panel-head">
              <h2>Tin nhà trường</h2>
              <a class="see-all" href="#">Xem tất cả</a>
            </div>
            <ul class="news" id="schoolNews"></ul>
          </article>

          <article class="panel">
            <div class="panel-head"><h2>Hoạt động sinh viên</h2></div>
            <ul class="news" id="activityNews"></ul>
          </article>
        </div>

        <div class="col">
          <article class="panel">
            <div class="panel-head">
              <h2>Tin đào tạo</h2>
              <a class="see-all" href="#">Xem tất cả</a>
            </div>
            <ul class="news" id="trainingNews"></ul>
          </article>
        </div>
      </section>
    </main>

    <!-- Thư viện đọc file Excel (SheetJS) - chỉ dùng để lấy tên sinh viên -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="TrangChu.js"></script>
  </body>
</html>
